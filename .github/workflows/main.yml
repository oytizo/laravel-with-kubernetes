name: Laravel CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  ci-stage:
    name: Continuous Integration (Build & Push)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Pure PHP-FPM Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/laravel-app:latest
            ${{ secrets.DOCKER_USERNAME }}/laravel-app:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  cd-stage:
    name: Continuous Deployment (Kubernetes)
    needs: ci-stage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Copy Kubernetes Manifests & Configs to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "app.yaml,mysql.yaml,laravel-configmap.yaml,mysql-configmap.yaml,.docker/"
          target: "~/laravel-k8s"

     # Update the script section under "Execute Remote Deployment via SSH" in your deploy.yml:

     # Update the script section under "Execute Remote Deployment via SSH" in your deploy.yml:

      - name: Execute Remote Deployment via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/laravel-k8s

            # Ensure host persistent storage directory exists for MySQL
            sudo mkdir -p /mnt/mysql-data
            sudo chmod 777 /mnt/mysql-data

            # Dynamically inject the unique GitHub SHA image tag into app.yaml
            sed -i "s|image: .*laravel-app:.*|image: ${{ secrets.DOCKER_USERNAME }}/laravel-app:${{ github.sha }}|g" app.yaml

            # Execute with a login shell wrapper to load MicroK8s seamlessly
            bash -l -c "microk8s kubectl apply -f mysql-configmap.yaml"
            bash -l -c "microk8s kubectl apply -f laravel-configmap.yaml"
            bash -l -c "microk8s kubectl apply -f mysql.yaml"
            bash -l -c "microk8s kubectl apply -f app.yaml"

            # Trigger the zero-downtime cluster rollout restart
            bash -l -c "microk8s kubectl rollout restart deployment/laravel-app"
